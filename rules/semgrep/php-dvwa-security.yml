rules:
  - id: synapdome.php.reflected-xss-superglobal
    mode: taint
    languages:
      - php
    severity: WARNING
    message: User-controlled request data reaches HTML output. Encode with htmlspecialchars or a trusted templating escape function.
    metadata:
      category: security
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation"
      owasp:
        - A03:2021 - Injection
    pattern-sources:
      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: $_REQUEST[...]
      - pattern: $_COOKIE[...]
    pattern-sinks:
      - pattern: echo ...;
      - pattern: print(...);

  - id: synapdome.php.sql-injection-superglobal
    mode: taint
    languages:
      - php
    severity: ERROR
    message: User-controlled request data reaches a SQL execution sink. Use prepared statements and parameter binding.
    metadata:
      category: security
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp:
        - A03:2021 - Injection
    pattern-sources:
      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: $_REQUEST[...]
      - pattern: $_COOKIE[...]
    pattern-sinks:
      - pattern: mysqli_query($CONN, ...);
      - pattern: mysql_query(...);
      - pattern: $PDO->query(...);
      - pattern: $PDO->exec(...);

  - id: synapdome.php.command-injection-superglobal
    mode: taint
    languages:
      - php
    severity: ERROR
    message: User-controlled request data reaches an OS command sink. Avoid shell execution or use strict allowlists and escaping.
    metadata:
      category: security
      cwe:
        - "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      owasp:
        - A03:2021 - Injection
    pattern-sources:
      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: $_REQUEST[...]
      - pattern: $_COOKIE[...]
    pattern-sinks:
      - pattern: shell_exec(...);
      - pattern: exec(...);
      - pattern: system(...);
      - pattern: passthru(...);
      - pattern: popen(...);
      - pattern: proc_open(...);

  - id: synapdome.php.file-inclusion-superglobal
    mode: taint
    languages:
      - php
    severity: ERROR
    message: User-controlled request data reaches a file include/read sink. Restrict to an allowlist of expected local files.
    metadata:
      category: security
      cwe:
        - "CWE-98: Improper Control of Filename for Include/Require Statement in PHP Program"
      owasp:
        - A03:2021 - Injection
    pattern-sources:
      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: $_REQUEST[...]
      - pattern: $_COOKIE[...]
    pattern-sinks:
      - pattern: include ...;
      - pattern: include_once ...;
      - pattern: require ...;
      - pattern: require_once ...;
      - pattern: file_get_contents(...);
      - pattern: fopen(...);

  - id: synapdome.php.weak-md5-password-hash
    languages:
      - php
    severity: WARNING
    message: MD5 is not suitable for password hashing. Use password_hash with PASSWORD_DEFAULT or Argon2id.
    metadata:
      category: security
      cwe:
        - "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      owasp:
        - A02:2021 - Cryptographic Failures
    patterns:
      - pattern-either:
          - pattern: md5($PASSWORD)
          - pattern: md5(...)

  - id: synapdome.php.weak-equality-comparison
    languages:
      - php
    severity: INFO
    message: Loose equality can cause type juggling bugs. Prefer strict comparison with === or !== for security-sensitive checks.
    metadata:
      category: security
      cwe:
        - "CWE-697: Incorrect Comparison"
    pattern-either:
      - pattern: $A == $B
      - pattern: $A != $B

  - id: synapdome.php.hardcoded-credential-variable
    languages:
      - php
    severity: WARNING
    message: Hardcoded credential-like value found. Move secrets to environment-backed configuration or a secret store.
    metadata:
      category: security
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      owasp:
        - A07:2021 - Identification and Authentication Failures
    patterns:
      - pattern-either:
          - pattern: $password = "...";
          - pattern: $passwd = "...";
          - pattern: $pwd = "...";
          - pattern: $db_password = "...";
          - pattern: $dbpass = "...";
